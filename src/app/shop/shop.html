<main>
  <section class="filter">

    <!-- ძებნა -->
<form class="search" (submit)="$event.preventDefault()">
  <input
    id="search"
    name="search"
    class="searchBox"
    type="search"
    placeholder="Search"
    [(ngModel)]="inputText"
  />
  <label for="search">
    <i class="fa-solid fa-magnifying-glass" style="color: black"></i>
  </label>
</form>

      <!-- კატეგორიების მიხედვით აქტივაცია -->

<form class="category">
<select id="category" (change)="changeCat(+$any($event.target).value)">
  <option value="0" [selected]="active() === 0">All Categories</option>

  @for (item of categories(); track item.id) {
    <option [value]="item.id" [selected]="item.id === active()">
      {{ item.name | titlecase }}
    </option>
  }
</select>
</form>


      <!--ბრენდები-->

<form class="brand">
<select id="brand" (change)="changeBrand($any($event.target).value)">
  <option value="" [selected]="!activeBrand()">All Brands</option>
  @for (item of brands(); track item) {
    <option [value]="item" [selected]="item === activeBrand()">
      {{ item | titlecase }}
    </option>
  }
</select>
</form>

</section>
      




    <section class="product">
      @for (item of product(); track $index) {
        <div class="productBox"
        [routerLink]="['/details' , item._id]">
          <img [src]="item.thumbnail" [alt]="item.title" />
          <h2>{{ item.title | titlecase}}</h2>
          <div class="price">
            <h4>Price: {{ item.price.current }} {{ item.price.currency }}</h4>
            <h5>{{ item.price.beforeDiscount }} {{ item.price.currency }}</h5>
          </div>
        </div>
      }
    </section>

</main>
